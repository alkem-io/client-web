overwrite: true
# The schema is fetched from a running server by default: CODEGEN_SCHEMA is set
# in the committed .env (http://localhost:3000/graphql) and `pnpm codegen` loads
# .env/.env.local via dotenv-flow. To work offline, point it at a local SDL
# snapshot from .env.local (e.g. CODEGEN_SCHEMA=./schema.graphql) — that file is
# gitignored and must never be committed.
schema: '${CODEGEN_SCHEMA:http://localhost:3000/graphql}'
documents:
  - 'src/**/*.graphql'
hooks:
  afterAllFileWrite:
    - biome check --fix --unsafe
    - biome format --write
generates:
  src/core/apollo/generated/graphql-schema.ts:
    plugins:
      - typescript
      - typescript-operations
    config:
      maybeValue: T | undefined
      preResolveTypes: true
      scalars:
        Upload: File
        TextID: string
        NameID: string
        Emoji: string
        UUID: string
        DID: string
        CID: string
        DateTime: Date
        JSON: string
        Markdown: string
        MessageID: string
        LifecycleDefinition: string
        MemoContent: string
        WhiteboardContent: string
        SearchCursor: string
      strictScalars: true
  src/core/apollo/generated/apollo-hooks.ts:
    preset: import-types
    presetConfig:
      typesPath: ./graphql-schema
      importTypesNamespace: SchemaTypes
    plugins:
      - typescript-react-apollo
    config:
      withHooks: true
      withRefetchFn: true
  src/core/apollo/generated/apollo-helpers.ts:
    plugins:
      - typescript-apollo-client-helpers
