worker_processes 4;

# workspace#033-client-runtime-hardening: the unprivileged base runs as UID 101,
# which cannot write /var/run or /var/cache/nginx. Point the pid file and every
# temp path at /tmp (the nginx-unprivileged convention).
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        # 8080, not 80: a non-root process cannot bind privileged ports.
        listen 8080;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Prevent caching of index.html when accessed directly
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Prevent caching of meta.json when accessed directly
        location = /meta.json {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Prevent caching of robots.txt
        location = /robots.txt {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            default_type text/plain;
            try_files $uri =404;
        }

        # Prevent caching of env-config.js when accessed directly
        location = /env-config.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri =404;
        }

        # Handle static assets with normal caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Handle API routes (if any) - pass through without index.html fallback
        location /api/ {
            try_files $uri =404;
        }

        # Handle all other routes (SPA routes) - serve index.html with no-cache headers
        location / {
            try_files $uri @index;
        }

        location /appui {
            try_files $uri @index;
        }

        # Named location to serve index.html with no-cache headers for SPA routes
        location @index {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files /index.html =404;
        }
    }
}
