kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: default
  name: alkemio-web-deployment
  labels:
    app: alkemio-web

spec:
  replicas: 1
  selector:
    matchLabels:
      app: alkemio-web
  template:
    metadata:
      labels:
        app: alkemio-web
    spec:
      # The SPA never calls the Kubernetes API, but the default ServiceAccount is
      # bound cluster-wide to pods/exec + pods/log — mounting its token into an
      # internet-facing pod is a free privilege-escalation step for anyone who
      # gets code execution here.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alkemio-web
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-web:latest
          envFrom:
            - configMapRef:
                name: alkemio-config
          ports:
            - name: web
              containerPort: 8080
          # The hardened image (workspace#033) runs as UID 101. These fields must
          # stay in step with the dev-orchestration kustomize base, which applies
          # the same workload from the other direction.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
