apiVersion: v1
kind: Service
metadata:
  name: alkemio-web-service

spec:
  ports:
    - protocol: TCP
      name: web
      # port stays 80 (what the IngressRoute targets); only the hop to the
      # container follows it to 8080 — the hardened image (workspace#033) runs
      # unprivileged as UID 101 and cannot bind a privileged port.
      port: 80
      targetPort: 8080
  selector:
    app: alkemio-web
