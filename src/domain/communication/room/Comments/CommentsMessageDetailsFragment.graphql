fragment MessageDetails on Message {
  id
  message
  timestamp
  reactions {
    ...ReactionDetails
  }
  threadID
  sender {
    ...ContributorDetails
  }
  attachments {
    ...MessageAttachmentDetails
  }
}

fragment MessageAttachmentDetails on MessageAttachment {
  id
  url
  displayName
  mimeType
  size
  width
  height
}

fragment ReactionDetails on Reaction {
  id
  emoji
  timestamp
  sender {
    id
    profile {
      id
      displayName
    }
  }
}
