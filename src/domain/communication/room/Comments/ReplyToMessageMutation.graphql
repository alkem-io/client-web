mutation ReplyToMessage($roomId: UUID!, $message: String!, $threadId: MessageID!, $attachmentUpload: RoomMessageAttachmentInput) {
  sendMessageReplyToRoom(messageData: { roomID: $roomId, threadID: $threadId, message: $message, attachmentUpload: $attachmentUpload }) {
    id
    message
    sender {
      id
      type
    }
    timestamp
    attachments {
      ...MessageAttachmentDetails
    }
  }
}
