query CurrentUserFull {
  me {
    user {
      ...UserDetails
      account {
        id
        authorization {
          id
          myPrivileges
        }
        license {
          id
          availableEntitlements
        }
      }
    }
  }
}

fragment InvitationData on CommunityInvitationResult {
  id
  spacePendingMembershipInfo {
    id
    level
    about {
     ...SpaceAboutMinimalUrl
    }
  }
  invitation {
    id
    welcomeMessage
    suggestedLanguage
    extraRoles
    invitedToParent
    nextEvents
    createdBy {
      id
      profile {
        id
        displayName
      }
    }
    state
    createdDate
    actor {
      id
      type
      profile {
        id
        displayName
        url
      }
    }
    spacesToJoinOnAccept {
      id
      profile {
        id
        displayName
        url
      }
    }
  }
}

fragment EntitlementDetails on LicenseEntitlement {
  id
  type
  limit
  usage
  isAvailable
  dataType
  enabled
}
