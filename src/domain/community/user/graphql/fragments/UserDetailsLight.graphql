fragment UserDetailsLight on User {
  id
  firstName
  lastName
  email
  profile {
    id
    displayName
    avatar: visual(type: AVATAR) {
      ...VisualModel
    }
    url
  }
  settings {
    id
    homeSpace {
      spaceID
      autoRedirect
    }
    dashboard {
      activityView
    }
    notification {
      sound {
        chatMessage
        inAppNotification
      }
    }
  }
}
