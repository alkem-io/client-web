query InnovationHub($subdomain: String) {
  platform {
    id
    innovationHub(subdomain: $subdomain) {
      ...InnovationHubHomeInnovationHub
    }
  }
}

fragment InnovationHubHomeInnovationHub on InnovationHub {
  id
  nameID
  subdomain
  type
  spaceVisibilityFilter
  profile {
    id
    displayName
    tagline
    description
    banner: visual(type: BANNER_WIDE) {
      id
      uri
      alternativeText
    }
  }
  spaceListFilter {
    id
  }
  # Curated Innovation Packs — card-data selections mirror InnovationLibraryPacksPaginated
  # so the hub section reuses the Innovation Library card + mapper verbatim (FR-004).
  innovationPackListFilter {
    id
    profile {
      id
      displayName
      description
      tagset {
        ...TagsetDetails
      }
      url
    }
    templatesSet {
      id
      calloutTemplatesCount
      spaceTemplatesCount
      communityGuidelinesTemplatesCount
      postTemplatesCount
      whiteboardTemplatesCount
    }
    provider {
      ...InnovationPackProviderProfileWithAvatar
    }
  }
  # Curated Virtual Contributors — profile selections mirror AccountResourceProfile so the
  # hub section renders the exact User Profile VC card data shape (FR-005).
  virtualContributorListFilter {
    id
    profile {
      ...AccountResourceProfile
    }
  }
  authorization {
    myPrivileges
  }
}
