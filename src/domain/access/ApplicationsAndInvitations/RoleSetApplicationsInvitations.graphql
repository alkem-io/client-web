query CommunityApplicationsInvitations($roleSetId: UUID!, $includeApplications: Boolean = true) {
  lookup {
    roleSet(ID: $roleSetId) {
      id
      authorization {
        myPrivileges
      }
      applications @include(if: $includeApplications) {
        ...AdminCommunityApplication
      }
      invitations {
        ...AdminCommunityInvitation
      }
      platformInvitations {
        ...AdminPlatformInvitationCommunity
      }
    }
  }
}

fragment AdminCommunityApplication on Application {
  id
  createdDate
  updatedDate
  state
  nextEvents
  actor {
    ...AdminCommunityCandidateMember
  }
  questions {
    id
    name
    value
  }
  user {
    id
    email
  }
}

fragment AdminCommunityInvitation on Invitation {
  id
  createdDate
  updatedDate
  state
  nextEvents
  extraRoles
  actor {
    ...AdminCommunityCandidateMember
  }
}

fragment AdminPlatformInvitationCommunity on PlatformInvitation {
  id
  createdDate
  email
}

fragment AdminCommunityCandidateMember on Actor {
  id
  type
  profile {
    id
    displayName
    url
  }
}
