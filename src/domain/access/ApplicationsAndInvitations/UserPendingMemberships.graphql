query UserPendingMemberships {
  me {
    user {
      ...UserDetails
    }
    communityApplications(states: ["new"]) {
      id
      spacePendingMembershipInfo {
        id
        level
        about {
          ...SpaceAboutMinimalUrl
          # Selected here rather than in SpaceAboutMinimalUrl: six queries spread
          # that fragment, including CurrentUserFull on every page load.
          # Both visuals are needed: per the canonical visual-fields rule an L0
          # space has no avatar (cardBanner only), while L1/L2 subspaces do.
          profile {
            avatar: visual(type: AVATAR) {
              ...VisualModel
            }
            cardBanner: visual(type: CARD) {
              ...VisualModel
            }
          }
        }
      }
      application {
        id
        state
        createdDate
      }
    }
    communityInvitations(states: ["invited"]) {
      ...InvitationData
    }
    organizationInvitations(states: ["invited"]) {
      ...OrgPendingInvitationData
    }
    organizationApplications(states: ["new"]) {
      ...OrgPendingApplicationData
    }
  }
}

fragment OrgPendingInvitationData on OrganizationInvitationResult {
  id
  invitation {
    id
    extraRoles
    welcomeMessage
    createdDate
    createdBy {
      id
      profile {
        id
        displayName
      }
    }
    nextEvents
  }
  organization {
    id
    profile {
      id
      displayName
      url
      avatar: visual(type: AVATAR) {
        ...VisualModel
      }
    }
  }
}

fragment OrgPendingApplicationData on OrganizationApplicationResult {
  id
  application {
    id
    state
    createdDate
    nextEvents
  }
  organization {
    id
    profile {
      id
      displayName
      url
      avatar: visual(type: AVATAR) {
        ...VisualModel
      }
    }
  }
}
