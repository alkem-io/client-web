fragment InnovationFlowStates on InnovationFlow {
  id
  states {
    id
    displayName
    description
    sortOrder
    settings {
      allowNewCallouts
      visible
      descriptionDisplayMode
      showPublishDetails
      sidebar
    }
    defaultCalloutTemplate {
      id
      profile {
        id
        displayName
      }
      type
    }
  }
}