mutation UpdateInnovationFlowCurrentState($innovationFlowId: UUID!, $currentStateId: UUID!) {
  updateInnovationFlowCurrentState(
    innovationFlowStateData: { innovationFlowID: $innovationFlowId, currentStateID: $currentStateId }
  ) {
    id
    currentState {
      displayName
    }
  }
}

mutation CreateStateOnInnovationFlow($stateData: CreateStateOnInnovationFlowInput!) {
  createStateOnInnovationFlow(stateData: $stateData) {
    id
    displayName
    description
    settings {
      allowNewCallouts
      descriptionDisplayMode
      showPublishDetails
      sidebar
    }
  }
}

mutation DeleteStateOnInnovationFlow($stateData: DeleteStateOnInnovationFlowInput!) {
  deleteStateOnInnovationFlow(stateData: $stateData) {
    id
  }
}

mutation UpdateInnovationFlowState(
  $innovationFlowStateId: UUID!
  $displayName: String!
  $description: Markdown!
  $settings: UpdateInnovationFlowStateSettingsInput
) {
  updateInnovationFlowState(
    stateData: {
      innovationFlowStateID: $innovationFlowStateId
      displayName: $displayName
      description: $description
      settings: $settings
    }
  ) {
    id
    displayName
    description
    settings {
      allowNewCallouts
      visible
      descriptionDisplayMode
      showPublishDetails
      sidebar
    }
  }
}

mutation UpdateInnovationFlowStateSettings($innovationFlowStateId: UUID!, $settings: UpdateInnovationFlowStateSettingsInput) {
  # True partial update (FR-013): sends ONLY settings — no displayName, no description.
  # Every non-settings field is optional on the input and "omission leaves the stored value
  # unchanged", so a concurrent rename or description edit is never clobbered by a settings save.
  updateInnovationFlowState(
    stateData: { innovationFlowStateID: $innovationFlowStateId, settings: $settings }
  ) {
    id
    displayName
    settings {
      allowNewCallouts
      visible
      descriptionDisplayMode
      showPublishDetails
      sidebar
    }
  }
}

mutation UpdateInnovationFlowStatesSortOrder($innovationFlowID: UUID!, $stateIDs: [UUID!]!) {
  # The server returns ALL states and, on subspace (L1/L2) flows, keeps sidebar lists attached
  # to their position — a reorder moves the lists between states. Selecting settings.sidebar
  # lets the normalized cache update every InnovationFlowState by id, so the subspace page and
  # Customize Sidebar are current without a refetch. The settings object has no id, so Apollo
  # replaces it wholesale: every settings field must be selected here, matching the settings
  # update mutation, or the other cached settings would be dropped.
  updateInnovationFlowStatesSortOrder(sortOrderData: { innovationFlowID: $innovationFlowID, stateIDs: $stateIDs }) {
    id
    sortOrder
    settings {
      allowNewCallouts
      visible
      descriptionDisplayMode
      showPublishDetails
      sidebar
    }
  }
}
