mutation CreatePostOnCallout($calloutId: UUID!, $post: CreatePostInput!, $taskColumn: String) {
  createContributionOnCallout(contributionData: {
    calloutID: $calloutId,
    type: POST,
    post: $post,
    taskColumn: $taskColumn
  }) {
    post {
      id
      profile {
        id
        url
      }
    }
  }
}

