fragment CalloutSettingsFull on CalloutSettings {
  contribution {
    enabled
    allowedTypes
    canAddContributions
    commentsEnabled
  }
  framing {
    commentsEnabled
    contributors {
      contributorTypes
      defaultContributorType
      defaultView
      mapView {
        longitude
        latitude
        zoom
      }
    }
    selection {
      mode
      selectedIds
    }
  }
  visibility
}