subscription ConversationEvents {
  conversationEvents {
    eventType
    conversationCreated {
      conversation {
        id
        room {
          id
          attachmentBucketId
          type
          displayName
          avatarUrl
          createdDate
        }
        members {
          id
          type
          profile {
            id
            displayName
            url
            avatar: visual(type: AVATAR) {
              id
              uri
            }
          }
        }
      }
    }
    conversationUpdated {
      conversation {
        id
        room {
          id
          attachmentBucketId
          displayName
          avatarUrl
        }
      }
    }
    conversationDeleted {
      conversationID
    }
    memberAdded {
      conversation {
        id
      }
      addedMember {
        id
        type
        profile {
          id
          displayName
          url
          avatar: visual(type: AVATAR) {
            id
            uri
          }
        }
      }
    }
    memberRemoved {
      conversation {
        id
      }
      removedMemberID
    }
  }
}
