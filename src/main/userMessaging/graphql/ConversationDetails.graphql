query ConversationDetails($conversationId: UUID!) {
  lookup {
    conversation(ID: $conversationId) {
      id
      room {
        id
        type
        displayName
        avatarUrl
        createdDate
      }
      members {
        id
        type
        profile {
          id
          displayName
          url
          avatar: visual(type: AVATAR) {
            id
            uri
          }
        }
      }
    }
  }
}
