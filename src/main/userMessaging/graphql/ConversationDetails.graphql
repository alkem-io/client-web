query ConversationDetails($conversationId: UUID!) {
  lookup {
    conversation(ID: $conversationId) {
      id
      room {
        id
        type
        displayName
        avatarUrl
        createdDate
        unreadCount
        messagesCount
        lastMessage {
          id
          message
          timestamp
          sender {
            id
            type
            profile {
              id
              displayName
              avatar: visual(type: AVATAR) {
                id
                uri
              }
            }
          }
          reactions {
            id
            emoji
            timestamp
            sender {
              id
              profile {
                id
                displayName
              }
            }
          }
          # Media attachments (feature 013). Selected everywhere a Message is
          # read so the normalized cache entity is never incomplete, and so a
          # media-only message gets a list preview instead of a blank row.
          attachments {
            id
            url
            displayName
            mimeType
            size
            width
            height
          }
        }
      }
      members {
        id
        type
        profile {
          id
          displayName
          url
          avatar: visual(type: AVATAR) {
            id
            uri
          }
        }
      }
    }
  }
}
