query UserConversations {
  me {
    conversations {
      conversations {
        id
        room {
          id
          attachmentBucketId
          type
          displayName
          avatarUrl
          createdDate
        }
        members {
          id
          type
          profile {
            id
            displayName
            url
            avatar: visual(type: AVATAR) {
              id
              uri
            }
          }
        }
      }
    }
  }
}
